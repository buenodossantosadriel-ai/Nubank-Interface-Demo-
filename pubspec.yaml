name: nubank_interface_demo
description: Interface demonstrativa Flutter inspirada em um layout financeiro de referência.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Gotham-SSm
      fonts:
        - asset: assets/fonts/GothamSSm-Book.ttf
          weight: 400
        - asset: assets/fonts/GothamSSm-Medium.ttf
          weight: 500
        - asset: assets/fonts/GothamSSm-Bold.ttf
          weight: 700
